<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">PTU-Net wordmark</title>
  <desc id="desc">A patch grid connected to the PTU-Net project name and research software label.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#0b1f33"/>
    </linearGradient>
  </defs>
  <rect width="760" height="180" rx="18" fill="#f5f8fb"/>
  <rect x="28" y="28" width="124" height="124" rx="14" fill="url(#panel)"/>
  <g fill="none" stroke="#91c6e8" stroke-width="3">
    <rect x="48" y="48" width="36" height="36" rx="4"/>
    <rect x="96" y="48" width="36" height="36" rx="4"/>
    <rect x="48" y="96" width="36" height="36" rx="4"/>
    <rect x="96" y="96" width="36" height="36" rx="4"/>
  </g>
  <path d="M66 66 L114 114 M114 66 L66 114" stroke="#f3b562" stroke-width="5" stroke-linecap="round"/>
  <text x="184" y="91" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="1">PTU-Net</text>
  <text x="187" y="127" fill="#486581" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="2">PATCH TRANSFORMER U-NET</text>
  <text x="616" y="43" fill="#627d98" font-family="Arial, Helvetica, sans-serif" font-size="15">RESEARCH SOFTWARE</text>
</svg>
