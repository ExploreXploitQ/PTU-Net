name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove private paths, credentials, unpublished data, and sensitive logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest command, configuration, and synthetic input that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a full commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, PyTorch, operating system, device, and CUDA versions as relevant.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste a concise traceback or log excerpt.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, private data, and host-specific personal paths.
          required: true
